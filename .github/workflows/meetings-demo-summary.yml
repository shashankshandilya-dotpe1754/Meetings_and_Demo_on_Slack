name: Meetings and Demo Summary

on:
  schedule:
    # 05:30 UTC = 11:00 AM IST (UTC+5:30), every day except Monday
    # Cron day-of-week: 0=Sun,1=Mon,2=Tue,3=Wed,4=Thu,5=Fri,6=Sat
    - cron: "30 5 * * 0,2,3,4,5,6"
  workflow_dispatch: {}   # lets you manually trigger a run from the Actions tab

jobs:
  send-summary:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pandas pytz gspread requests pymupdf pillow slack_sdk \
                      oauth2client google-api-python-client gspread-formatting \
                      python-dotenv

      - name: Write Google service account key to file
        run: echo "$GOOGLE_SERVICE_ACCOUNT_JSON" > service_account.json
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

      - name: Run Meetings and Demo summary
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: service_account.json
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        run: python Meetings_and_Demo1.py
